name: Android CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests (BS conversion, Tithi calculation, repeating events)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Build installable APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/miti.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miti-apk
          path: |
            app/build/outputs/apk/release/miti.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (Tag Push Only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/miti-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release (Tag Push Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/miti-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
